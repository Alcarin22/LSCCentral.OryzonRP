<section class="convenios-page">
  <div class="convenios-view">

    <header class="convenios-header">
      <h1>Convenios</h1>
      <p>Consulta categorizada de acuerdos del taller.</p>
    </header>

    <div class="convenios-categories-grid">
      <article class="card convenio-category-card" *ngFor="let categoria of categorias">

        <div class="card-header">
          <h3>{{ categoria }}</h3>
        </div>

        <div class="convenio-list">

          <div
            class="convenio-item"
            *ngFor="let convenio of getConveniosPorCategoria(categoria)"
            [class.is-open]="isConvenioAbierto(convenio)"
            (click)="toggleConvenio(convenio)"
          >

            <!-- HEADER -->
            <div class="convenio-summary">
              <h4>{{ convenio.nombre }}</h4>

              <span
                class="convenio-status"
                [class.status-active]="convenio.estado === 'Activo'"
                [class.status-inactive]="convenio.estado === 'Inactivo'"
              >
                {{ convenio.estado }}
              </span>
            </div>

            <!-- DETALLE -->
            <div class="convenio-details" *ngIf="isConvenioAbierto(convenio)">

              <!-- 🔥 MODO NORMAL -->
              <ng-container *ngIf="!isEditando(convenio); else modoEdicion">

                <div class="convenio-detail-grid">
                  <div class="convenio-detail-item">
                    <span>Local</span>
                    <strong>{{ convenio.nombre }}</strong>
                  </div>

                  <div class="convenio-detail-item">
                    <span>Categoría</span>
                    <strong>{{ convenio.categoria }}</strong>
                  </div>
                </div>

                <div class="convenio-conditions">
                  <span>Condiciones</span>
                  <ul>
                    <li *ngFor="let c of convenio.condiciones">{{ c }}</li>
                  </ul>
                </div>

                <div class="convenio-actions">

                  <button
                    *ngIf="puedeEditar()"
                    class="btn btn-secondary"
                    (click)="iniciarEdicion($event, convenio)"
                  >
                    Editar
                  </button>

                  <button
                    class="btn btn-primary"
                    (click)="abrirDocumento($event, convenio)"
                  >
                    Ver documento
                  </button>

                </div>

              </ng-container>

              <!-- 🔥 MODO EDICIÓN -->
              <ng-template #modoEdicion>

                <div
                  class="convenio-edit-grid"
                  (click)="$event.stopPropagation()"
                  (keydown)="$event.stopPropagation()"
                >

                  <div class="form-group">
                    <label>Local</label>
                    <input [(ngModel)]="editNombre" />
                  </div>

                  <div class="form-group">
                    <label>Categoría</label>
                    <select [(ngModel)]="editCategoria">
                      <option *ngFor="let c of categorias" [value]="c">{{ c }}</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label>Estado</label>
                    <select [(ngModel)]="editEstado">
                      <option *ngFor="let e of estados" [value]="e">{{ e }}</option>
                    </select>
                  </div>

                  <div class="form-group form-group-full">
                    <label>Condiciones</label>
                    <textarea [(ngModel)]="editCondiciones"></textarea>
                  </div>

                </div>

                <div class="convenio-actions" (click)="$event.stopPropagation()">

                  <button
                    class="btn btn-secondary"
                    (click)="cancelarEdicion($event)"
                  >
                    Cancelar
                  </button>

                  <button
                    class="btn btn-primary"
                    (click)="guardarEdicion($event, convenio)"
                  >
                    Guardar
                  </button>

                </div>

              </ng-template>

            </div>
          </div>

        </div>
      </article>
    </div>

  </div>
</section>
