<section class="precios-page">
  <div class="prices-view">

    <header class="prices-header">
      <h1>Precios</h1>
      <p>Consulta rápida de precios del taller.</p>
    </header>

    <div class="prices-layout">

      <!-- 🔥 FULL TUNING (IZQUIERDA GRANDE) -->
      <article class="card price-table-card price-table-large">
        <div class="price-table-title">
          <h3>Full Tuning</h3>
        </div>

        <div class="price-table-wrapper">
          <table class="price-table">
            <thead>
              <tr>
                <th>Tipo</th>
                <th>Precio</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let ft of fullTuning">
                <td>{{ ft.tipo }}</td>
                <td>{{ ft.precio }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </article>

      <!-- 🔥 REPARACIONES -->
      <article class="card price-table-card">
        <div class="price-table-title">
          <h3>Reparaciones</h3>
        </div>

        <div class="price-table-wrapper">
          <table class="price-table">
            <thead>
              <tr>
                <th>Tipo</th>
                <th>Precio</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let r of reparaciones">
                <td>{{ r.tipo }}</td>
                <td>{{ r.precio }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </article>

      <!-- 🔥 TUNEO -->
      <article class="card price-table-card">
        <div class="price-table-title">
          <h3>Tuneo</h3>
        </div>

        <div class="price-table-wrapper">
          <table class="price-table">
            <thead>
              <tr>
                <th>Tipo</th>
                <th>Precio</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let t of tuneos">
                <td>{{ t.tipo }}</td>
                <td>{{ t.precio }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </article>

      <!-- 🔥 KITS -->
      <article class="card price-table-card">
        <div class="price-table-title">
          <h3>Kits</h3>
        </div>

        <div class="price-table-wrapper">
          <table class="price-table">
            <thead>
              <tr>
                <th>Tipo</th>
                <th>Precio</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let k of kits">
                <td>{{ k.tipo }}</td>
                <td>{{ k.precio }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </article>

      <!-- 🔥 CONVENIOS -->
      <article class="card price-table-card price-table-small">
        <div class="price-table-title">
          <h3>Convenios</h3>
        </div>

        <div class="price-table-wrapper">
          <table class="price-table">
            <thead>
              <tr>
                <th>Descuento</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let c of convenios">
                <td>{{ c }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </article>

    </div>
  </div>
</section>
